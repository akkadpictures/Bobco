<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bob &amp; Co — الكوفي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --olive:#343925; --olive-deep:#282D1C; --cream:#EFE3CA; --cream-soft:#F6EFDF;
  --ink:#0F0F0F; --line:rgba(52,57,37,.16); --pos:#2f5c33; --neg:#9c3b2e; --gold:#b98524;
  --ar:'Almarai',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;max-width:100%;overflow-x:hidden}
body{font-family:var(--ar);background:var(--cream-soft);color:var(--ink);padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
button{font-family:var(--ar);cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--ar);font-size:1rem}
.num{direction:ltr;font-variant-numeric:tabular-nums;display:inline-block}

/* ===== الدخول ===== */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--olive)}
.gate-card{background:var(--cream);border-radius:20px;padding:36px 30px;width:min(360px,92vw);text-align:center}
.gate-card h2{font-size:1.35rem;font-weight:400;margin:4px 0 20px}
.gate-card input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;text-align:center;font-size:1.3rem;letter-spacing:.3em;background:#fff}
.gate-card button{width:100%;margin-top:12px;background:var(--olive);color:var(--cream);padding:13px;border-radius:12px;font-weight:800;font-size:1rem}
#gateErr{color:var(--neg);font-size:.85rem;margin-top:10px;min-height:1.2em}

/* ===== الهيكل ===== */
#app{display:none;max-width:1280px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header .wm{font-family:Georgia,"Times New Roman",serif;color:var(--olive);font-size:1.25rem;letter-spacing:.04em;direction:ltr}
header .sub{color:var(--olive);font-size:.95rem;font-weight:700;opacity:.75}
.tabs{display:flex;gap:6px;margin-inline-start:auto}
.tab{padding:9px 16px;border-radius:999px;border:1px solid var(--line);font-weight:800;font-size:.9rem;background:#fff;color:var(--olive)}
.tab.on{background:var(--olive);color:var(--cream);border-color:var(--olive)}
#logoutBtn{font-size:.8rem;opacity:.55;font-weight:700;padding:8px}
.view{display:none}.view.on{display:block}

/* ===== الكاشير ===== */
.pos{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
.cats{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:8px 16px;border-radius:999px;font-weight:800;font-size:.88rem;background:transparent;color:var(--olive);border:1px solid var(--line)}
.cat.on{background:var(--cream);border-color:transparent}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{position:relative;background:#fff;border-radius:16px;padding:18px 14px 14px;text-align:start;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 2px rgba(15,15,15,.05);transition:transform .12s ease,box-shadow .12s ease}
.item:active{transform:scale(.97)}
.item b{font-size:1.02rem;font-weight:800;line-height:1.35;color:var(--ink)}
.item .pr{font-size:.95rem;font-weight:700;color:var(--olive);opacity:.8}
.item .q{position:absolute;top:10px;inset-inline-end:10px;min-width:28px;height:28px;border-radius:999px;background:var(--olive);color:var(--cream);font-weight:800;font-size:.9rem;display:none;align-items:center;justify-content:center;padding:0 8px}
.item.in{box-shadow:0 0 0 2px var(--olive)}
.item.in .q{display:flex}
.item.other{background:transparent;border:1.5px dashed rgba(52,57,37,.35);box-shadow:none}
.item.other b{color:var(--olive)}

.order{background:#fff;border-radius:20px;padding:18px;position:sticky;top:14px;box-shadow:0 1px 2px rgba(15,15,15,.05)}
.order h3{font-size:1rem;font-weight:800;color:var(--olive);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.order h3 button{font-size:.8rem;opacity:.55;font-weight:700}
.lines{max-height:38vh;overflow:auto;margin:0 -4px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid rgba(52,57,37,.07)}
.line .nm{font-weight:700;font-size:.95rem;cursor:pointer}
.line .nm small{display:block;font-weight:400;opacity:.55;font-size:.75rem;margin-top:2px}
.stepper{display:flex;align-items:center;gap:2px;background:var(--cream-soft);border-radius:999px;padding:3px}
.stepper button{width:30px;height:30px;border-radius:999px;font-weight:800;font-size:1.1rem;color:var(--olive)}
.stepper button:active{background:#fff}
.stepper span{min-width:20px;text-align:center;font-weight:800}
.line .tot{font-weight:800;min-width:56px;text-align:left}
.empty{padding:26px 6px;text-align:center;opacity:.5;font-size:.9rem}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0 4px}
.pay{padding:11px 4px;border-radius:12px;font-weight:800;font-size:.88rem;background:var(--cream-soft);color:var(--olive)}
.pay.on{background:var(--olive);color:var(--cream)}
.usdrow{display:none;margin-top:8px}
.usdrow.on{display:block}
.usdrow input,.frow input,.frow select,.frow textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 2px}
.total span{font-weight:700;opacity:.65}
.total b{font-size:2rem;font-weight:800;color:var(--olive)}
.cur{font-size:.75rem;opacity:.5;font-weight:700;text-align:left}
.go{display:block;width:100%;background:var(--olive);color:var(--cream);padding:17px;border-radius:15px;font-weight:800;font-size:1.1rem;margin-top:12px;transition:opacity .15s}
.go:disabled{opacity:.3;cursor:default}
.today-mini{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid rgba(52,57,37,.08);font-size:.82rem;font-weight:700;opacity:.7}

/* شريط الطلب عالموبايل */
.mbar{display:none}
@media(max-width:860px){
  .pos{grid-template-columns:1fr}
  .order{position:fixed;inset-inline:0;bottom:0;top:auto;border-radius:22px 22px 0 0;z-index:40;max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.18)}
  .order.open{transform:none}
  .mbar{display:flex;position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--olive);color:var(--cream);border-radius:16px;padding:15px 18px;font-weight:800;justify-content:space-between;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .mbar.hide{display:none}
  #app{padding-bottom:110px}
  .menu{grid-template-columns:repeat(2,1fr)}
  header .tabs{order:3;width:100%;margin:0}
  header .tab{flex:1;text-align:center}
}

/* ===== دفتر اليوم ===== */
.dayhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.dayhead .nav{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:800}
.dayhead input[type=date]{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kcard{background:#fff;border-radius:16px;padding:16px 12px;text-align:center}
.kcard .v{font-size:1.55rem;font-weight:800;color:var(--olive)}
.kcard .l{font-size:.75rem;opacity:.6;font-weight:700;margin-top:2px}
.kcard.dark{background:var(--olive)}
.kcard.dark .v,.kcard.dark .l{color:var(--cream)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.act{background:#fff;border-radius:14px;padding:15px 10px;font-weight:800;color:var(--olive);font-size:.92rem}
.act.main{background:var(--olive);color:var(--cream)}
.panel{background:#fff;border-radius:18px;padding:6px 16px 10px;margin-bottom:14px}
.panel h4{font-size:.8rem;font-weight:800;opacity:.55;padding:12px 0 6px}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid rgba(52,57,37,.07);align-items:center;cursor:pointer}
.row:last-child{border-bottom:none}
.row b{font-weight:800;font-size:.92rem}
.row small{display:block;opacity:.55;font-size:.75rem;margin-top:3px;font-weight:400}
.row .amt{font-weight:800;white-space:nowrap}
.row .amt.neg{color:var(--neg)}
.tag{font-size:.68rem;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--cream);color:var(--olive);margin-inline-start:6px;vertical-align:1px}
.tag.usd{background:#e2ead9;color:var(--pos)}
.tag.treat{background:#f1e4cc;color:var(--gold)}
.tag.debt{background:#f3dcd7;color:var(--neg)}
.cups{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 12px}
.cups span{background:var(--cream-soft);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700}
.cups b{color:var(--olive)}

/* ===== النوافذ ===== */
.overlay{position:fixed;inset:0;background:rgba(15,15,15,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.on{display:flex}
.sheet{background:var(--cream-soft);border-radius:22px 22px 0 0;width:min(560px,100vw);max-height:92vh;overflow:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin-bottom:14px;font-size:1.15rem}
.frow{margin-bottom:12px}
.frow label{display:block;font-size:.8rem;font-weight:800;opacity:.7;margin-bottom:5px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-weight:700;font-size:.86rem;background:#fff}
.chip.on{background:var(--olive);color:var(--cream);border-color:var(--olive)}
.btn{display:block;width:100%;background:var(--olive);color:var(--cream);padding:14px;border-radius:13px;font-weight:800;font-size:1.02rem;margin-top:14px;text-align:center;text-decoration:none}
.btn.ghost{background:#fff;color:var(--olive);border:1px solid var(--line)}
.btn.danger{background:var(--neg)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muted{opacity:.6;font-size:.8rem}
.hint{font-size:.78rem;opacity:.6;margin-top:6px}

.toast{position:fixed;bottom:22px;inset-inline:0;margin:auto;width:fit-content;max-width:92vw;background:var(--ink);color:var(--cream);padding:12px 14px 12px 22px;border-radius:999px;font-weight:800;z-index:99;opacity:0;pointer-events:none;transition:.25s;display:flex;gap:14px;align-items:center}
.toast.show{opacity:1;pointer-events:auto}
.toast button{background:var(--cream);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.85rem;display:none}
.toast.undo button{display:inline-block}
@media(max-width:860px){ .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))} .sheet{width:100vw} }
@media(prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<div id="gate">
  <div style="display:flex;flex-direction:column;align-items:center;gap:26px">
    <img src="logo-en.svg" alt="Bob &amp; Co" style="width:190px">
    <div class="gate-card">
      <h2>كاشير الكوفي</h2>
      <input id="pin" type="password" inputmode="text" placeholder="كلمة السر" autocomplete="current-password">
      <button onclick="tryPin()">دخول</button>
      <div id="gateErr"></div>
    </div>
  </div>
</div>

<div id="app">
  <header>
    <span class="wm">BOB &amp; CO</span>
    <span class="sub">الكوفي</span>
    <div class="tabs">
      <button class="tab on" data-v="pos" onclick="showView('pos')">الكاشير</button>
      <button class="tab" data-v="day" onclick="showView('day')">دفتر اليوم</button>
    </div>
    <button id="logoutBtn" onclick="logout()">خروج</button>
  </header>

  <!-- الكاشير -->
  <section class="view on" id="v-pos">
    <div class="pos">
      <div>
        <div class="cats" id="cats"></div>
        <div class="menu" id="menu"></div>
      </div>
      <aside class="order" id="order">
        <h3>الطلب <button onclick="clearCart()">تفريغ</button></h3>
        <div class="lines" id="lines"></div>
        <div class="pays">
          <button class="pay on" data-p="cash" onclick="setPay('cash')">كاش</button>
          <button class="pay" data-p="usd" onclick="setPay('usd')">دولار</button>
          <button class="pay" data-p="treat" onclick="setPay('treat')">ضيافة</button>
        </div>
        <div class="usdrow" id="usdRow"><input id="usdIn" type="number" inputmode="decimal" min="0" step="0.5" placeholder="كم دولار انقبض؟"></div>
        <div class="total"><span id="totLbl">المجموع</span><b class="num" id="tot">0</b></div>
        <div class="cur">ليرة جديدة</div>
        <button class="go" id="goBtn" onclick="checkout()" disabled>سجّل</button>
        <div class="today-mini"><span>اليوم: <span class="num" id="miniCups">0</span> كاسة</span><span>مبيعات <span class="num" id="miniSum">0</span></span></div>
      </aside>
    </div>
    <button class="mbar hide" id="mbar" onclick="openOrder()"><span id="mbarL">الطلب</span><span class="num" id="mbarR">0</span></button>
  </section>

  <!-- دفتر اليوم -->
  <section class="view" id="v-day">
    <div class="dayhead">
      <button class="nav" onclick="shiftDay(1)">‹</button>
      <input type="date" id="dayPick" onchange="setDay(this.value)">
      <button class="nav" onclick="shiftDay(-1)">›</button>
      <button class="nav" onclick="setDay(bizToday())">اليوم</button>
    </div>
    <div class="kgrid" id="kpis"></div>
    <div class="actions">
      <button class="act" onclick="openExpense()">＋ مصروف</button>
      <button class="act" onclick="openCount()">عدّ الصندوق</button>
      <button class="act main" onclick="openReport()">تقرير آخر اليوم</button>
    </div>
    <div id="dayBody"></div>
  </section>
</div>

<div class="overlay" id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn">تراجع</button></div>

<script src="config.js"></script>
<script>
/* =====================================================================
   Bob & Co — كاشير الكوفي
   - صفحة مستقلة متل الاستقبال: دخول لحالها، وما بتغذّي نظام المحاسبة أبداً
   - المبالغ بتنحفظ بالليرة القديمة (متل كل النظام) وبتنعرض بالليرة الجديدة (÷100)
   - يوم الكوفي بيسكّر الساعة 4 الفجر: أي شي قبلها بينحسب عاليوم اللي قبل
   ===================================================================== */
const K = 100;                                   // قديمة ← جديدة
const nl = v => fmt((+v || 0) / K);              // عرض بالليرة الجديدة
const CUTOFF_H = 4;
const AR_DAYS = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const bizToday = () => { const d = new Date(); d.setHours(d.getHours() - CUTOFF_H); return iso(d); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const tm = r => new Date(r.created_at).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const cupsOf = r => (r.items || []).reduce((s, i) => s + (+i.qty || 0), 0);
const itemsTxt = r => (r.items || []).map(i => i.name + (+i.qty > 1 ? " ×" + i.qty : "")).join("، ");

let ITEMS = [], CAT = null, CART = [], PAY = "cash", DAY = bizToday(), ROWS = [], REPORT = null;

/* ---------- الدخول (محفوظ عالجهاز 3 أيام متل الاستقبال) ---------- */
const REM_KEY = "bobco_coffee", REM_MS = 3 * 864e5;
function remember(){ try { localStorage.setItem(REM_KEY, String(Date.now())); } catch(_){} }
function remembered(){
  try { const t = +localStorage.getItem(REM_KEY); if (t && Date.now() - t < REM_MS) return true; localStorage.removeItem(REM_KEY); } catch(_){}
  return false;
}
async function tryPin(){
  const v = document.getElementById("pin").value.trim(), err = document.getElementById("gateErr");
  if (!v) return;
  err.textContent = "";
  const { data, error } = await db.from("settings").select("value").eq("key", "coffee_pin").maybeSingle();
  if (error || !data) { err.textContent = "ما قدرنا نتحقق — جرّب كمان مرة"; return; }
  if (data.value !== v) { err.textContent = "كلمة السر غلط"; document.getElementById("pin").value = ""; return; }
  remember(); enter();
}
document.getElementById("pin").addEventListener("keydown", e => { if (e.key === "Enter") tryPin(); });
function logout(){ try { localStorage.removeItem(REM_KEY); } catch(_){} location.reload(); }

async function enter(){
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  await loadMenu();
  await loadDay();
}

/* ---------- المنيو ---------- */
async function loadMenu(){
  const { data } = await db.from("coffee_items").select("*").eq("active", true).order("sort");
  ITEMS = data || [];
  const cats = [...new Set(ITEMS.map(i => i.category || "أخرى"))];
  if (!CAT || !cats.includes(CAT)) CAT = cats[0] || null;
  document.getElementById("cats").innerHTML = cats.map(c =>
    `<button class="cat ${c === CAT ? "on" : ""}" onclick="setCat('${esc(c)}')">${esc(c)}</button>`).join("");
  renderMenu();
}
function setCat(c){ CAT = c; document.querySelectorAll(".cat").forEach(b => b.classList.toggle("on", b.textContent === c)); renderMenu(); }
function renderMenu(){
  const list = ITEMS.filter(i => (i.category || "أخرى") === CAT);
  document.getElementById("menu").innerHTML = list.map(i => {
    const q = CART.filter(l => l.id === i.id).reduce((s, l) => s + l.qty, 0);
    return `<button class="item ${q ? "in" : ""}" onclick="addItem(${i.id})">
      <span class="q">${q}</span><b>${esc(i.name)}</b><span class="pr num">${nl(i.price)}</span></button>`;
  }).join("") + `<button class="item other" onclick="openManual()"><b>＋ أخرى</b><span class="pr">مبلغ يدوي</span></button>`;
}

/* ---------- الطلب ---------- */
function addItem(id){
  const it = ITEMS.find(x => x.id === id); if (!it) return;
  const l = CART.find(x => x.id === id && x.price === +it.price);
  l ? l.qty++ : CART.push({ id, name: it.name, price: +it.price, base: +it.price, qty: 1 });
  if (navigator.vibrate) navigator.vibrate(8);
  renderCart();
}
function step(i, d){ CART[i].qty += d; if (CART[i].qty <= 0) CART.splice(i, 1); renderCart(); }
function clearCart(){ CART = []; setPay("cash"); renderCart(); }
function setPay(p){
  PAY = p;
  document.querySelectorAll(".pay").forEach(b => b.classList.toggle("on", b.dataset.p === p));
  document.getElementById("usdRow").classList.toggle("on", p === "usd");
  if (p !== "usd") document.getElementById("usdIn").value = "";
  renderCart();
}
const cartSum = () => CART.reduce((s, l) => s + l.price * l.qty, 0);
const cartQty = () => CART.reduce((s, l) => s + l.qty, 0);
function renderCart(){
  document.getElementById("lines").innerHTML = CART.length ? CART.map((l, i) => `
    <div class="line">
      <div class="nm" onclick="editPrice(${i})">${esc(l.name)}<small>${l.price !== l.base ? "سعر معدّل · " : ""}<span class="num">${nl(l.price)}</span> للكاسة</small></div>
      <div class="stepper"><button onclick="step(${i},1)" aria-label="زيادة">+</button><span>${l.qty}</span><button onclick="step(${i},-1)" aria-label="إنقاص">−</button></div>
      <div class="tot num">${nl(l.price * l.qty)}</div>
    </div>`).join("") : `<div class="empty">اكبس على أي مشروب ليبلّش الطلب</div>`;
  const sum = cartSum(), q = cartQty();
  document.getElementById("tot").textContent = PAY === "treat" ? "0" : nl(sum);
  document.getElementById("totLbl").textContent = PAY === "treat" ? `ضيافة (قيمتها ${nl(sum)})` : "المجموع";
  document.getElementById("goBtn").disabled = !CART.length;

function setDay(v){ if (!v) return; DAY = v; loadDay(); }
function shiftDay(n){ const d = new Date(DAY + "T12:00:00"); d.setDate(d.getDate() + n); setDay(iso(d)); }
async function loadDay(){
  document.getElementById("dayPick").value = DAY;
  const { data, error } = await db.from("coffee_sales").select("*").eq("sale_date", DAY).order("created_at", { ascending: false });
  if (error) { document.getElementById("dayBody").innerHTML = `<div class="panel"><p class="empty">ما قدرنا نجيب الدفتر — ${esc(error.message)}</p></div>`; return; }
  ROWS = data || [];
  renderDay();
  if (DAY === bizToday()) {
    const A = calc();
    document.getElementById("miniCups").textContent = A.cups;
    document.getElementById("miniSum").textContent = nl(A.sales);
  }
}
function calc(){
  const sales = ROWS.filter(r => r.kind === "sale");
  const paid = sales.filter(r => r.pay !== "treat"), treats = sales.filter(r => r.pay === "treat");
  const exps = ROWS.filter(r => r.kind === "expense");
  const tillExp = exps.filter(r => r.pay !== "debt"), debts = exps.filter(r => r.pay === "debt");
  const usdRows = paid.filter(r => r.pay === "usd");
  const per = {};
  sales.forEach(r => (r.items || []).forEach(i => { per[i.name] = (per[i.name] || 0) + (+i.qty || 0); }));
  const A = {
    saleRows: sales, paid, treats, exps, tillExp, debts, per,
    cups: sales.reduce((s, r) => s + cupsOf(r), 0),
    treatCups: treats.reduce((s, r) => s + cupsOf(r), 0),
    treatVal: treats.reduce((s, r) => s + (r.items || []).reduce((a, i) => a + i.price * i.qty, 0), 0),
    sales: paid.reduce((s, r) => s + +r.amount, 0),
    usd: usdRows.reduce((s, r) => s + (+r.usd || 0), 0),
    usdVal: usdRows.reduce((s, r) => s + +r.amount, 0),
    expSum: tillExp.reduce((s, r) => s + +r.amount, 0),
    debtSum: debts.reduce((s, r) => s + +r.amount, 0),
    count: ROWS.find(r => r.kind === "count") || null
  };
  A.cashSales = A.sales - A.usdVal;                 // اللي دخل ليرة عالدرج
  A.net = A.sales - A.expSum;                       // صافي اليوم (الدين ما بينطرح)
  A.cashNet = A.cashSales - A.expSum;               // اللي لازم يزيد عالدرج بالليرة
  return A;
}
function renderDay(){
  const A = calc();
  const kc = (v, l, dark) => `<div class="kcard ${dark ? "dark" : ""}"><div class="v num">${v}</div><div class="l">${l}</div></div>`;
  document.getElementById("kpis").innerHTML =
    kc(nl(A.sales), "مبيعات اليوم") + kc(A.cups, "كاسات") +
    (A.usd ? kc(A.usd + "$", "منها دولار") : "") +
    kc(nl(A.expSum), "مصاريف") + kc(nl(A.net), "الصافي", true);

  const pays = { cash: "", usd: `<span class="tag usd">دولار</span>`, treat: `<span class="tag treat">ضيافة</span>` };
  const cupsHtml = Object.entries(A.per).sort((a, b) => b[1] - a[1]).map(([n, q]) => `<span>${esc(n)} <b>${q}</b></span>`).join("");
  let h = "";
  if (cupsHtml) h += `<div class="panel"><h4>شو انباع اليوم</h4><div class="cups">${cupsHtml}</div></div>`;
  h += `<div class="panel"><h4>المبيعات — اكبس لتعدّل أو تمسح</h4>${A.saleRows.length ? A.saleRows.map(r => `
    <div class="row" onclick="openSale('${r.id}')">
      <div><b>${esc(itemsTxt(r)) || "—"}${pays[r.pay] || ""}</b><small>${tm(r)}${r.pay === "usd" ? ` · ${+r.usd}$` : ""}${r.note ? " · " + esc(r.note) : ""}</small></div>
      <div class="amt num">${r.pay === "treat" ? "0" : nl(r.amount)}</div></div>`).join("") : `<p class="empty">ما في مبيعات لهاليوم</p>`}</div>`;
  if (A.exps.length) h += `<div class="panel"><h4>المصاريف</h4>${A.exps.map(r => `
    <div class="row" onclick="openExpense('${r.id}')">
      <div><b>${esc(r.what || "مصروف")}${r.pay === "debt" ? `<span class="tag debt">دين — ما انطرح</span>` : ""}</b><small>${tm(r)}${r.note ? " · " + esc(r.note) : ""}</small></div>
      <div class="amt num ${r.pay === "debt" ? "" : "neg"}">${r.pay === "debt" ? "" : "−"}${nl(r.amount)}</div></div>`).join("")}</div>`;
  if (A.count) h += `<div class="panel"><div class="row" onclick="openCount()"><div><b>عدّ الصندوق</b><small>${tm(A.count)}</small></div><div class="amt num">${nl(A.count.amount)}</div></div></div>`;
  document.getElementById("dayBody").innerHTML = h;
}

/* ---------- تقرير آخر اليوم (بنفس أسلوب تقرير الاستقبال) ---------- */
async function openReport(){
  const { data } = await db.from("coffee_sales").select("*").eq("kind", "count").lt("sale_date", DAY).order("sale_date", { ascending: false }).limit(1);
  const prev = (data || [])[0] || null, A = calc();
  const d = new Date(DAY + "T12:00:00");
  const title = `${AR_DAYS[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
  const L = [];
  if (Object.keys(A.per).length){
    L.push({ k: "h", r: `الكاسات (${A.cups})` });
    Object.entries(A.per).sort((a, b) => b[1] - a[1]).forEach(([n, q]) => L.push({ k: "row", r: n, l: String(q) }));
    L.push({ k: "gap" });
  }
  L.push({ k: "h", r: "المبيعات" });
  L.push({ k: "sum", r: "مجموع المبيعات", l: nl(A.sales) });
  if (A.usd) L.push({ k: "sum", r: `منها مقبوض دولار (قيمتها ${nl(A.usdVal)})`, l: A.usd + "$" });
  if (A.usd) L.push({ k: "sum", r: "منها كاش ليرة", l: nl(A.cashSales) });
  if (A.treatCups) L.push({ k: "row", r: `ضيافة: ${A.treatCups} كاسة (قيمتها ${nl(A.treatVal)})`, l: "0" });
  L.push({ k: "gap" });
  if (A.tillExp.length){
    L.push({ k: "h", r: "مصاريف من الصندوق" });
    A.tillExp.forEach(r => L.push({ k: "row", r: (r.what || "مصروف") + (r.note ? " — " + r.note : ""), l: "−" + nl(r.amount), neg: true }));
    L.push({ k: "gap" });
  }
  if (A.debts.length){
    L.push({ k: "h", r: "دين عالمورّد (ما انطرح)" });
    A.debts.forEach(r => L.push({ k: "row", r: (r.what || "بضاعة") + (r.note ? " — " + r.note : ""), l: nl(r.amount) }));
    L.push({ k: "gap" });
  }
  L.push({ k: "h", r: "الخلاصة" });
  L.push({ k: "sum", r: "مبيعات", l: nl(A.sales) });
  if (A.expSum) L.push({ k: "sum", r: "مصاريف", l: "−" + nl(A.expSum), neg: true });
  L.push({ k: "big", r: "صافي الكوفي اليوم", l: nl(A.net) });
  const pv = prev ? +prev.amount : null, cnt = A.count ? +A.count.amount : null;
  if (pv !== null) L.push({ k: "sum", r: `صندوق ${prev.sale_date.slice(8)}/${prev.sale_date.slice(5, 7)} + الكاش الصافي`, l: nl(pv + A.cashNet) });
  if (cnt !== null) L.push({ k: "big", r: "صندوق الكوفي (عدّ الدرج)", l: nl(cnt) });
  if (A.count && A.count.usd) L.push({ k: "sum", r: "دولار بالدرج", l: +A.count.usd + "$" });
  if (cnt !== null && pv !== null && cnt !== pv + A.cashNet) {
    const diff = cnt - pv - A.cashNet;
    L.push({ k: "sum", r: "فرق العدّ عن المتوقع", l: (diff > 0 ? "+" : "−") + nl(Math.abs(diff)), neg: true });
  }
  REPORT = { title, L };
  REPORT.text = `Bob & Co — تقرير الكوفي\n${title}\n(بالليرة الجديدة)\n\n` + L.map(x =>
    x.k === "gap" ? "" : x.k === "h" ? `*${x.r}*` : x.k === "big" ? `*${x.r}: ${x.l}*` : `${x.r}: ${x.l}`).join("\n").replace(/\n{3,}/g, "\n\n");

  let img = "";
  try {
    const cv = reportCanvas(), dataUrl = cv.toDataURL("image/png");
    const blob = await new Promise(r => cv.toBlob(r, "image/png"));
    if (REPORT.url) URL.revokeObjectURL(REPORT.url);
    REPORT.url = URL.createObjectURL(blob);
    const name = `bobco-coffee-${DAY}.png`;
    try { REPORT.file = new File([blob], name, { type: "image/png" }); } catch(_){ REPORT.file = null; }
    img = `<div class="frow"><label>عالموبايل: كبسة طويلة عالصورة ← «حفظ» أو «مشاركة»</label>
      <img src="${dataUrl}" alt="تقرير الكوفي" style="width:100%;border-radius:14px;display:block"></div>
      <a class="btn" href="${REPORT.url}" download="${name}">نزّل التقرير صورة</a>
      ${navigator.canShare && REPORT.file && navigator.canShare({ files: [REPORT.file] }) ? `<button class="btn ghost" onclick="shareReport()">شارك (واتساب…)</button>` : ""}`;
  } catch(e) { img = `<p class="muted" style="color:var(--neg)">ما طلعت الصورة عهالجهاز — استعمل «انسخ النص»</p>`; }
  sheet(`<h3>تقرير الكوفي — ${title}</h3>${img}<button class="btn ghost" onclick="copyReport()">انسخ النص</button>`);
}
async function shareReport(){ try { await navigator.share({ files: [REPORT.file], title: "تقرير الكوفي" }); } catch(_){} }
async function copyReport(){
  try { await navigator.clipboard.writeText(REPORT.text); toast("✓ انسخ"); }
  catch(_){ const t = document.createElement("textarea"); t.value = REPORT.text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); toast("✓ انسخ"); }
}
function reportCanvas(){
  const W = 1080, P = 64, H_ = { h: 76, row: 50, sum: 54, big: 84, gap: 22 };
  const L = REPORT.L, bodyH = L.reduce((s, x) => s + H_[x.k], 0);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = 250 + bodyH + 90;
  const c = cv.getContext("2d"), fam = getComputedStyle(document.body).fontFamily || "sans-serif";
  const OL = "#343925", CR = "#EFE3CA", BG = "#F6EFDF", NEG = "#9c3b2e";
  c.fillStyle = BG; c.fillRect(0, 0, W, cv.height);
  c.fillStyle = OL; c.fillRect(0, 0, W, 200);
  c.fillStyle = CR; c.textBaseline = "middle";
  c.direction = "ltr"; c.textAlign = "left"; c.font = `400 54px Georgia, "Times New Roman", serif`; c.fillText("BOB & CO", P, 84);
  c.direction = "rtl"; c.textAlign = "right"; c.font = `800 40px ${fam}`; c.fillText("تقرير الكوفي", W - P, 76);
  c.font = `400 30px ${fam}`; c.globalAlpha = .85; c.fillText(REPORT.title + " · ليرة جديدة", W - P, 134); c.globalAlpha = 1;
  let y = 236;
  const two = (x, size, weight, color) => {
    c.fillStyle = color; c.font = `${weight} ${size}px ${fam}`;
    c.direction = "rtl"; c.textAlign = "right"; c.fillText(x.r, W - P, y + H_[x.k] / 2, W - 2 * P - 260);
    if (x.l !== undefined){ c.direction = "ltr"; c.textAlign = "left"; c.fillText(x.l, P, y + H_[x.k] / 2); }
  };
  for (const x of L){
    if (x.k === "h"){ c.fillStyle = "rgba(52,57,37,.14)"; c.fillRect(P, y + H_.h - 12, W - 2 * P, 2); two(x, 38, 800, OL); }
    else if (x.k === "row") two(x, 30, 400, x.neg ? NEG : "#4a4f3c");
    else if (x.k === "sum") two(x, 31, 700, x.neg ? NEG : OL);
    else if (x.k === "big"){ c.fillStyle = OL; c.beginPath(); c.roundRect ? c.roundRect(P - 20, y + 8, W - 2 * P + 40, H_.big - 16, 18) : c.rect(P - 20, y + 8, W - 2 * P + 40, H_.big - 16); c.fill(); two(x, 36, 800, CR); }
    y += H_[x.k];
  }
  c.fillStyle = "rgba(52,57,37,.5)"; c.direction = "rtl"; c.textAlign = "right"; c.font = `400 24px ${fam}`;
  c.fillText("من كاشير الكوفي · " + new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }), W - P, y + 46);
  return cv;
}

/* ---------- أدوات ---------- */
function showView(v){
  document.querySelectorAll(".view").forEach(x => x.classList.toggle("on", x.id === "v-" + v));
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.v === v));
  if (v === "day") loadDay();
}
function sheet(html){ document.getElementById("sheet").innerHTML = html; document.getElementById("ov").classList.add("on"); }
function closeSheet(){ document.getElementById("ov").classList.remove("on"); }
function toast(msg, undo){
  const t = document.getElementById("toast"), b = document.getElementById("toastBtn");
  document.getElementById("toastMsg").textContent = msg;
  t.classList.toggle("undo", !!undo);
  b.onclick = undo ? async () => { t.classList.remove("show"); b.onclick = null; await undo(); } : null;
  t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), undo ? 6000 : 2800);
}
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); closeOrder(); } });

if (remembered()) enter();
