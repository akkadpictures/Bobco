<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ar:'Almarai',sans-serif;--serif:'Cormorant Garamond',serif;--olive:#5a6b3b;--ink:#282D1C;--cream:#EFE3CA}
body{background:#EFE3CA;font-family:var(--ar);padding:50px 30px;margin:0;color:var(--ink)}
.eyebrow{display:flex;align-items:center;gap:16px;justify-content:center;font-family:var(--serif);font-style:italic;font-size:1.05rem;letter-spacing:.2em;opacity:.6;margin-bottom:22px}
.eyebrow::before,.eyebrow::after{content:"";height:1px;width:44px;background:currentColor;opacity:.5}
.sec-title{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:700;letter-spacing:0;line-height:1.4}
.about-title{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.logo{display:inline-block;background:var(--olive);-webkit-mask:url('logo-en.svg') center/contain no-repeat;mask:url('logo-en.svg') center/contain no-repeat;aspect-ratio:688/221}
.about-logo{width:clamp(120px,17vw,180px);transform:translateY(2px)}
.sub{text-align:center;font-weight:400;opacity:.65;margin-top:14px}
</style></head><body>
<div class="eyebrow">About the Shop</div>
<h2 class="sec-title about-title">عن صالون <span class="logo about-logo" role="img" aria-label="Bob & Co"></span></h2>
<p class="sub">باربر شوب وكوفي في دمشق — شرق حديقة التجارة</p>
</body></html>
