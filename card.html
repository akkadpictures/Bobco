*{box-sizing:border-box;margin:0}
html,body{background:var(--soft);color:var(--olive);font-family:'Almarai',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:440px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column;gap:14px}
.card{position:relative;border-radius:26px;overflow:hidden;background:var(--olive) var(--pat-green) 0 0/200% auto repeat-y;color:var(--cream);padding:26px 22px 24px;box-shadow:0 18px 40px -18px rgba(40,45,28,.55)}
.top{display:flex;justify-content:space-between;align-items:center}
.top img{height:26px;display:block}
.tag{font-family:'Montserrat';font-size:.62rem;letter-spacing:.32em;opacity:.75}
.hi{margin-top:26px;font-size:.95rem;font-weight:300;opacity:.85}
.nm{font-size:1.7rem;font-weight:800;margin-top:2px}
.dots{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:24px 0 16px;direction:rtl}
.dot{aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(239,227,202,.55);display:grid;place-items:center;font-size:.72rem;transition:.4s}
.dot.on{background:var(--cream);border-color:var(--cream)}
.dot.on svg{width:56%;height:56%}
.dot.gift{border-style:dashed;font-weight:700;font-size:.62rem;text-align:center;line-height:1.1}
.dot.gift.ready{background:var(--cream);color:var(--olive);border-style:solid;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(239,227,202,.18)}}
.rule{font-size:.9rem;opacity:.9}
.rule b{font-weight:800}
.state{background:#fff;border-radius:20px;padding:18px;border:1px solid var(--line);text-align:center}
.state .big{font-size:1.15rem;font-weight:800}
.state p{color:var(--mut);font-size:.88rem;margin-top:5px;line-height:1.7}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;text-align:center;padding:15px 10px;border-radius:16px;font-weight:700;font-size:.95rem;text-decoration:none}
.btn.p{background:var(--olive);color:var(--cream)}
.btn.g{background:#fff;color:var(--olive);border:1.5px solid var(--olive)}
.foot{text-align:center;color:var(--mut);font-size:.75rem;margin-top:auto;padding-top:8px}
.err{text-align:center;padding:60px 20px;color:var(--mut)}
.sk{opacity:.35}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="card sk"><div class="top"><img src="logo-en.svg" alt="Bob & Co"><span class="tag">LOYALTY</span></div><div class="hi">&nbsp;</div><div class="nm">&nbsp;</div><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
</div>
<script src="config.js"></script>
<script>
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#343925" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
(async () => {
  const app = document.getElementById("app");
  const t = new URLSearchParams(location.search).get("c") || "";
  if (!/^[a-f0-9]{8,32}$/.test(t)) { app.innerHTML = `<div class="err">الرابط مش صحيح — اطلب رابط بطاقتك من Bob & Co</div>`; return; }
  const { data, error } = await db.rpc("loyalty_card", { t });
  if (error || !data) { app.innerHTML = `<div class="err">ما لقينا البطاقة — اطلب رابطها من Bob & Co</div>`; return; }
  const s = +data.stamps || 0, ready = !!data.free_next, left = 5 - s;
  const dots = Array.from({ length: 5 }, (_, i) => `<div class="dot ${i < s ? "on" : ""}">${i < s ? CHECK : ""}</div>`).join("")
    + `<div class="dot gift ${ready ? "ready" : ""}">علينا</div>`;
  const st = ready
    ? `<div class="big">الحلاقة الجاية علينا</div><p>كمّلت 5 زيارات. بزيارتك الجاية الحلاقة مجانية، بس قول اسمك بالاستقبال.</p>`
    : s === 0 && !data.rewards
      ? `<div class="big">بطاقتك جاهزة</div><p>مع كل حلاقة بتاخد ختم. بعد 5 زيارات، السادسة علينا.</p>`
      : `<div class="big">باقيلك ${left} ${left === 1 ? "زيارة" : "زيارات"}</div><p>وبتصير الحلاقة علينا.</p>`;
  app.innerHTML = `
    <div class="card">
      <div class="top"><img src="logo-en.svg" alt="Bob & Co"><span class="tag">LOYALTY</span></div>
      <div class="hi">أهلاً</div><div class="nm">${esc(data.name)}</div>
      <div class="dots">${dots}</div>
      <div class="rule">كل <b>5 زيارات</b>، والسادسة علينا</div>
    </div>
    <div class="state">${st}${data.rewards ? `<p style="margin-top:8px">أخدت لهلق ${data.rewards} ${data.rewards === 1 ? "حلاقة" : "حلاقات"} علينا</p>` : ""}</div>
    <div class="btns">
      <a class="btn p" href="https://bobcosy.com/#book">احجز موعدك</a>
      <a class="btn g" href="https://wa.me/963949534048">راسلنا</a>
    </div>
    <div class="foot">Bob & Co · حي التجارة، دمشق<br>البطاقة بتتحدّث لحالها بعد كل زيارة</div>`;
})();
</script>
</body>
</html>
